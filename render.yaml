services:
  - type: web
    name: english-words-game
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: english-words-game-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data/english_words_game
