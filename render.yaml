services:
  - type: web
    name: english-words-game
    env: node
    plan: starter
    buildCommand: npm ci && python3 -m pip install --target ./.python_packages -r tools/requirements.txt
    startCommand: npm start
    disk:
      name: english-words-game-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data/english_words_game
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: TEMP_PASSWORD_ENCRYPTION_KEY
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Tokyo
      - key: NODE_ENV
        value: production
