<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>英語学習アプリ</title>
  <link rel="stylesheet" href="./style.css?v=20260616-rpg1">
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <p class="eyebrow">English Study</p>
      <h1>英語学習アプリ</h1>
    </header>

    <section class="mode-card" aria-labelledby="modeTitle">
      <h2 id="modeTitle">学習モード</h2>
      <div class="mode-grid" role="group" aria-label="学習モード選択">
        <button class="mode-button active" type="button" data-mode="word">英単語</button>
        <button class="mode-button" type="button" data-mode="chunk">チャンク</button>
        <button class="mode-button" type="button" data-mode="definition">英文和訳</button>
      </div>
      <p id="modeDescription" class="mode-description"></p>

      <section class="quiz-settings" aria-labelledby="settingsTitle">
        <h3 id="settingsTitle">出題設定</h3>
        <div class="setting-grid">
          <label class="setting-field" for="questionCount">
            <span>出題数</span>
            <select id="questionCount">
              <option value="10">10問</option>
              <option value="20">20問</option>
              <option value="30">30問</option>
              <option value="40">40問</option>
              <option value="50">50問</option>
              <option value="70">70問</option>
              <option value="100">100問</option>
              <option value="150">150問</option>
              <option value="all" selected>全て</option>
            </select>
          </label>
          <label class="random-toggle" for="randomOrder">
            <input id="randomOrder" type="checkbox">
            <span>ランダム出題</span>
          </label>
          <label class="speech-toggle" for="autoSpeech">
            <input id="autoSpeech" type="checkbox">
            <span>問題を自動で読み上げる</span>
          </label>
        </div>
        <button id="startQuizButton" class="secondary-button settings-start-button" type="button" disabled>この設定で出題開始</button>
        <p id="settingsStatus" class="settings-status">問題を読み込むと出題設定を利用できます。</p>
      </section>

      <div class="upload-box">
        <label class="upload-label" for="fileInput">CSV/Excelをアップロード</label>
        <input id="fileInput" type="file" accept=".csv,.xlsx,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
        <p id="uploadStatus" class="upload-status">標準CSVを読み込みます。手元の .csv / .xlsx でも差し替えできます。</p>
      </div>
    </section>

    <section class="stats-card" aria-label="学習成績">
      <div><span id="correctCount">0</span><small>正答数</small></div>
      <div><span id="answeredCount">0</span><small>出題数</small></div>
      <div><span id="accuracyRate">0%</span><small>正答率</small></div>
    </section>

    <section class="quiz-card" aria-live="polite">
      <div class="quiz-topline">
        <span id="modeLabel">英単語モード</span>
        <span id="progressLabel">0 / 0</span>
      </div>
      <h2 id="questionText">CSVを読み込み中...</h2>
      <button id="replaySpeechButton" class="speech-button" type="button" disabled>🔊 もう一度聞く</button>
      <div id="choices" class="choices"></div>
      <div id="feedback" class="feedback" hidden></div>
      <button id="nextButton" class="primary-button" type="button" disabled>次の問題へ</button>
    </section>

    <section class="review-card">
      <div>
        <h2>間違えた問題の復習</h2>
        <p id="reviewSummary">まだ間違えた問題はありません。</p>
      </div>
      <button id="reviewButton" class="secondary-button" type="button" disabled>復習を始める</button>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="./script.js"></script>
</body>
</html>
