<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>英語学習アプリ</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <p class="eyebrow">English Study</p>
      <h1>英語学習アプリ</h1>
    </header>

    <section class="mode-card" aria-labelledby="modeTitle">
      <h2 id="modeTitle">学習モード</h2>
      <div class="mode-grid" role="group" aria-label="学習モード選択">
        <button class="mode-button active" type="button" data-mode="word">英単語</button>
        <button class="mode-button" type="button" data-mode="chunk">チャンク</button>
        <button class="mode-button" type="button" data-mode="definition">英英辞典</button>
      </div>
      <p id="modeDescription" class="mode-description"></p>
      <div class="upload-box">
        <label class="upload-label" for="fileInput">CSV/Excelをアップロード</label>
        <input id="fileInput" type="file" accept=".csv,.xlsx,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
        <p id="uploadStatus" class="upload-status">標準CSVを読み込みます。手元の .csv / .xlsx でも差し替えできます。</p>
      </div>
    </section>

    <section class="stats-card" aria-label="学習成績">
      <div><span id="correctCount">0</span><small>正答数</small></div>
      <div><span id="answeredCount">0</span><small>出題数</small></div>
      <div><span id="accuracyRate">0%</span><small>正答率</small></div>
    </section>

    <section class="quiz-card" aria-live="polite">
      <div class="quiz-topline">
        <span id="modeLabel">英単語モード</span>
        <span id="progressLabel">0 / 0</span>
      </div>
      <h2 id="questionText">CSVを読み込み中...</h2>
      <div id="choices" class="choices"></div>
      <div id="feedback" class="feedback" hidden></div>
      <button id="nextButton" class="primary-button" type="button" disabled>次の問題へ</button>
    </section>

    <section class="review-card">
      <div>
        <h2>間違えた問題の復習</h2>
        <p id="reviewSummary">まだ間違えた問題はありません。</p>
      </div>
      <button id="reviewButton" class="secondary-button" type="button" disabled>復習を始める</button>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="./script.js"></script>
  <script>
    // Excelの列記号付き見出し（A row_number ～ L note）にも対応する。
    // 出題に必要なのはA～G列だけで、H～L列は空欄でもよい。
    COMMON_ALIASES.id.unshift('A row_number');
    COMMON_ALIASES.level.unshift('B level');
    COMMON_ALIASES.choice1.unshift('E choice1');
    COMMON_ALIASES.choice2.unshift('F choice2');
    COMMON_ALIASES.choice3.unshift('G choice3');
    COMMON_ALIASES.totalCorrect.unshift('H total_correct');
    COMMON_ALIASES.totalWrong.unshift('I total_wrong');
    COMMON_ALIASES.accuracy.unshift('J accuracy');
    COMMON_ALIASES.currentStreak.unshift('K current_streak');
    COMMON_ALIASES.note.unshift('L note');

    Object.values(MODES).forEach((mode) => {
      mode.questionAliases.unshift('C question');
      mode.correctAliases.unshift('D correct');
    });
  </script>
</body>
</html>
