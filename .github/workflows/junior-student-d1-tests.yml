name: Junior student login D1 tests
on:
  push:
    branches:
      - feature/junior-student-auth-d1-20261009
  pull_request:
    paths:
      - 'cloudflare/junior-student-*'
      - 'functions/api/student/**'
      - 'functions/api/admin/students/**'
      - 'migrations/d1-junior/**'
      - 'tests/junior_student_d1.test.mjs'
      - '.github/workflows/junior-student-d1-tests.yml'
permissions:
  contents: read
jobs:
  student-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run auth and D1 SQLite integration tests
        run: node --test tests/junior_student_d1.test.mjs
      - name: Existing R2 and static app regression tests
        run: |
          node scripts/build-static-junior.js
          node --test tests/static_junior_build.test.js tests/junior_excel_upload.test.mjs
      - name: Verify Cloudflare Pages Functions compile
        run: npx --yes wrangler@4 pages functions build functions --outfile /tmp/junior-student-functions.js
