name: Junior Excel upload tests
on:
  push:
    branches:
      - feature/junior-excel-upload-r2-20261009
  pull_request:
    paths:
      - 'admin/junior-data/**'
      - 'cloudflare/**'
      - 'functions/**'
      - 'scripts/build-static-junior.js'
      - 'tests/junior_excel_upload.test.mjs'
      - 'tests/static_junior_build.test.js'
      - 'package*.json'
      - '.github/workflows/junior-excel-upload-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/build-static-junior.js
      - run: node --test tests/static_junior_build.test.js tests/junior_excel_upload.test.mjs
      - run: node node_modules/wrangler/bin/wrangler.js pages functions build functions --outfile /tmp/up-junior-pages-functions.js
