name: Generate fixed 20 audio files
on:
  push:
    branches: [feature/audio-pilot-20-20261013]
  pull_request:
    paths:
      - tools/run_audio_pilot.py
      - tools/run_full_audio.py
      - tools/run_audio_sample.py
      - tests/test_run_audio_pilot.py
      - .github/workflows/audio-pilot-20.yml
  workflow_dispatch:
    inputs:
      generate:
        description: 'Paid generation: fixed 10 words x Nova/Ash (20 files maximum; no publication)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: audio-r2-writes
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - name: Test fixed targets and zero-request reruns without paid API calls
        run: python -m unittest discover -s tests -p 'test_run*audio*.py'
      - name: Validate the fixed 20 files without API calls
        run: python tools/run_audio_pilot.py
      - name: Install audio tools and R2 client
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.generate }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install boto3==1.40.0
      - name: Generate only the fixed 20 files and verify zero-call reuse
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.generate }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python tools/run_audio_pilot.py --generate
      - name: Save listening files, progress and any rescue audio
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: nova-ash-pilot-20
          path: audio-preparation/pilot-20/
          retention-days: 30
          if-no-files-found: ignore
