name: Check full audio preparation (no API calls)
on:
  push:
    branches: [feature/audio-full-preparation-20261012]
  pull_request:
    paths:
      - tools/prepare_study_audio.py
      - tools/prepare_full_audio_batches.py
      - tools/audio-sample-plan.json
      - tests/test_prepare_study_audio.py
      - tests/test_prepare_full_audio_batches.py
      - .github/workflows/audio-full-prepare-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - name: Test Excel import and full batch preparation offline
        run: python -m unittest discover -s tests -p 'test_prepare*audio*.py'
