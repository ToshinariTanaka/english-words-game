<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>会員ログイン</title>
  <link rel="stylesheet" href="/auth-ui.css">
</head>
<body>
  <main class="narrow card">
    <h1>会員ログイン</h1>
    <p class="muted">全会員共通のログインページです。</p>
    <div id="message" class="message" role="alert"></div>
    <form id="login-form">
      <label>会員ID<input name="memberId" required maxlength="16" autocomplete="username" placeholder="UP000001"></label>
      <label>パスワード<input name="password" type="password" required maxlength="128" autocomplete="current-password"></label>
      <button type="submit">ログイン</button>
    </form>
    <p><a href="/">英語学習RPGへ戻る</a></p>
  </main>
  <script src="/auth-ui.js"></script>
  <script src="/member/login/script.js"></script>
</body>
</html>
