<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>英単語RPG MVP</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <section id="home-screen" class="screen active">
        <h1>英単語RPG</h1>
        <p>英単語モンスターを倒して gold を稼ごう！</p>
        <p id="version-label" class="hint">version</p>
        <div class="panel">
          <label for="csv-file">単語CSVを読み込む</label>
          <input id="csv-file" type="file" accept=".csv" />
          <p class="hint">形式: word,meaning,level</p>

          <label for="wordbook-category">カテゴリを選ぶ</label>
          <select id="wordbook-category"></select>

          <label for="wordbook-select">内蔵単語帳を選ぶ</label>
          <select id="wordbook-select"></select>
          <button id="load-wordbook-btn" type="button">選択した単語帳を読み込む</button>

          <label for="question-count">出題数を選ぶ</label>
          <select id="question-count">
            <option value="10">10問</option>
            <option value="20">20問</option>
            <option value="30">30問</option>
            <option value="50">50問</option>
            <option value="all">全問</option>
          </select>

          <button id="start-btn" type="button" disabled>ゲーム開始</button>
          <p id="home-message" class="message"></p>
        </div>
      </section>

      <section id="battle-screen" class="screen">
        <header class="status-bar">
          <span>HP: <strong id="hp">100</strong></span>
          <span>Gold: <strong id="gold">0</strong></span>
          <span>討伐数: <strong id="kills">0</strong></span>
        </header>

        <div class="panel battle-panel">
          <p id="encounter" class="encounter"></p>
          <h2 id="target-word" class="word"></h2>
          <div id="choices" class="choices"></div>
        </div>
      </section>

      <section id="result-screen" class="screen">
        <div class="panel">
          <h2>結果</h2>
          <p id="result-message" class="message"></p>
          <p id="answer-message" class="answer"></p>
          <button id="next-btn" type="button">次のバトルへ</button>
        </div>
      </section>

      <section id="gameclear-screen" class="screen">
        <div class="panel">
          <h2>ゲームクリア！</h2>
          <p id="clear-message" class="message"></p>
          <p id="clear-score"></p>
          <button id="clear-retry-btn" type="button">ホームに戻る</button>
        </div>
      </section>

      <section id="gameover-screen" class="screen">
        <div class="panel">
          <h2>病院送り</h2>
          <p id="final-score"></p>
          <button id="retry-btn" type="button">ホームに戻る</button>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
