<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理者ダッシュボード</title>
  <link rel="stylesheet" href="/auth-ui.css">
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <div><h1>管理者ダッシュボード</h1><p class="muted">会員・管理者認証基盤</p></div>
      <button id="logout" class="secondary">ログアウト</button>
    </div>
    <div id="message" class="message" role="alert"></div>
    <section class="card">
      <dl class="grid">
        <div class="stat"><dt>管理者名</dt><dd id="display-name">—</dd></div>
        <div class="stat"><dt>権限</dt><dd id="role">—</dd></div>
        <div class="stat"><dt>最終ログイン日時</dt><dd id="last-login">—</dd></div>
      </dl>
      <h2>管理機能</h2>
      <nav id="links" class="actions"></nav>
      <h2>自分のパスワード変更</h2>
      <form id="password-form">
        <div class="grid">
          <label>現在のパスワード<input name="currentPassword" type="password" required maxlength="128" autocomplete="current-password"></label>
          <label>新しいパスワード<input name="newPassword" type="password" required minlength="8" maxlength="128" autocomplete="new-password"></label>
          <label>新しいパスワード確認<input name="newPasswordConfirmation" type="password" required minlength="8" maxlength="128" autocomplete="new-password"></label>
        </div>
        <button type="submit">変更する</button>
      </form>
    </section>
  </main>
  <script src="/auth-ui.js"></script>
  <script src="/admin/dashboard/script.js"></script>
</body>
</html>
