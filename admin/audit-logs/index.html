<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>監査ログ</title>
  <link rel="stylesheet" href="/auth-ui.css">
</head>
<body>
  <main class="shell">
    <div class="topbar"><div><h1>監査ログ</h1><a href="/admin/dashboard/">ダッシュボードへ戻る</a></div><button id="refresh" class="secondary">更新</button></div>
    <div id="message" class="message" role="alert"></div>
    <section class="card">
      <p class="muted">最新200件まで表示します。パスワードやセッショントークンは記録されません。</p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>日時</th><th>操作</th><th>実行者</th><th>対象</th><th>補足</th></tr></thead>
          <tbody id="log-rows"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/auth-ui.js"></script>
  <script src="/admin/audit-logs/script.js"></script>
</body>
</html>
